name: Claude Issue Dedupe
permissions:
  contents: read

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process for duplicate detection'
        required: true
        type: string

jobs:
  claude-dedupe-issues:
    if: github.repository == 'oven-sh/bun'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: claude-dedupe-issues-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Claude Code slash command
        uses: anthropics/claude-code-action@2261fcfc88e7de1b55f179edd588805e12de71f2 # v1.0.228
        env:
          ANTHROPIC_MODEL: claude-opus-5
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_SCRIPT_CAPS: '{"comment-on-duplicates.sh":1}'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Issue text is untrusted: this strips the API key from the agent's subprocesses.
          # GH_TOKEN stays, because the helper scripts need it.
          allowed_non_write_users: "*"
          prompt: "/dedupe ${{ github.repository }}/issues/${{ github.event.issue.number || inputs.issue_number }}"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--disallowedTools "WebFetch,WebSearch,Write,Edit,MultiEdit,NotebookEdit"'
