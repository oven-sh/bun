name: Claude Find Issues for PR
permissions:
  contents: read

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to find related issues for'
        required: true
        type: string

jobs:
  claude-find-issues:
    if: github.repository == 'oven-sh/bun'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-find-issues-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find issues this PR may fix
        uses: anthropics/claude-code-action@2261fcfc88e7de1b55f179edd588805e12de71f2 # v1.0.228
        env:
          ANTHROPIC_MODEL: claude-opus-5
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_SCRIPT_CAPS: '{"comment-on-pr.sh":1}'
          COMMENT_MODE: --related-issues
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          prompt: "/find-issues ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr_number }}"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--disallowedTools "WebFetch,WebSearch,Write,Edit,MultiEdit,NotebookEdit,mcp__github,mcp__github_comment,mcp__github_inline_comment,mcp__github_file_ops,mcp__github_ci"'

      - name: Find duplicate PRs
        if: always()
        uses: anthropics/claude-code-action@2261fcfc88e7de1b55f179edd588805e12de71f2 # v1.0.228
        env:
          ANTHROPIC_MODEL: claude-opus-5
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_SCRIPT_CAPS: '{"comment-on-pr.sh":1}'
          COMMENT_MODE: --duplicate-prs
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          prompt: "/find-duplicate-prs ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr_number }}"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--disallowedTools "WebFetch,WebSearch,Write,Edit,MultiEdit,NotebookEdit,mcp__github,mcp__github_comment,mcp__github_inline_comment,mcp__github_file_ops,mcp__github_ci"'
