name: Close issues linked from merged PRs

# GitHub closes "Fixes #1" on merge, but only the first reference after each
# keyword: "Fixes #1, #2" leaves #2 open, "Supersedes #3" links nothing, and a
# pull request is never closed by a reference. This reads the merged PR's
# description and closes the rest: issues as completed, pull requests as
# superseded.
#
# Runs entirely against the GitHub API. Nothing is checked out and no code from
# the repository runs, so pull_request_target is safe here: the description is
# the only PR-controlled input, it is parsed as text, and it is read from the
# merge event, so an edit after the merge changes nothing.
#
# The description is not searched with a regex. A reference counts only when a
# keyword leads it, directly or through a list:
#
#   Fixes #1                 Closes: #2               Supersedes #3 and #4
#   Resolves #5, #6          Replaces #7, #8, and #9  Fixes #1 & #2
#   Closes https://github.com/oven-sh/bun/issues/10   Fixes oven-sh/bun#11
#   Fixes [#12](https://github.com/oven-sh/bun/issues/12)
#
# A bare "#1", "see #1", "related to #1", "part of #1", "fix for #1" or
# "#1's approach" is left alone. So is a keyword that is negated or hedged
# ("does not fix #1", "partially fixes #1", "may fix #1"), or that is not a
# verb ("the closed #1", "the rm fix #1"), or whose subject is another
# reference ("#100 supersedes #1", "reverts #100, which fixed #1"). Text in
# code spans, fenced or indented code blocks, blockquotes, HTML comments and
# strikethrough is skipped.
#
# test/internal/close-linked-issues.test.ts runs the script below against a
# fake API.

permissions:
  contents: read

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged PR whose description to read"
        required: true
        type: string
      dry_run:
        description: "Print what would be closed without closing anything"
        required: false
        type: boolean
        default: false

jobs:
  close-linked-issues:
    if: >
      github.repository == 'oven-sh/bun' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Close linked issues and pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const KEYWORDS = new Set([
              "close", "closes", "closed",
              "fix", "fixes", "fixed",
              "resolve", "resolves", "resolved",
              "supersede", "supersedes", "superseded",
              "replace", "replaces", "replaced",
            ]);

            // A keyword led by one of these does not state that the PR closes
            // anything: a negation ("does not fix #1"), a hedge ("may fix #1",
            // "partially fixes #1"), or a determiner or preposition that makes
            // the keyword an adjective ("the closed #1", "a comment on closed #1").
            const DISQUALIFIERS = new Set([
              "not", "never", "neither", "nor", "without", "cannot", "can't", "doesn't", "don't", "won't", "didn't",
              "isn't", "wasn't", "hasn't", "haven't", "hadn't",
              "partially", "partly", "partial",
              "may", "might", "could", "would", "possibly", "probably", "potentially", "maybe", "hopefully", "likely", "unlikely",
              "the", "a", "an", "of", "on", "in", "by", "from", "with", "for", "than",
            ]);

            // The base forms are nouns as often as verbs ("the rm fix #1"). They
            // count only where a noun cannot stand: at the start of a sentence or
            // line ("Fix #1"), or after one of these words ("will fix #1", "and fix
            // #1"). "to" is not one of them: an infinitive says nothing about what
            // the PR does ("unable to fix #1", "how to fix #1", "decided not to close #1").
            const BASE_FORMS = new Set(["close", "fix", "resolve", "supersede", "replace"]);
            const VERB_MARKERS = new Set(["will", "shall", "should", "does", "do", "did", "and", "we", "they", "i"]);

            // A clause that starts with one of these is a condition or a time, not a
            // statement about this PR: "once we fix #1", "if this fixes #1".
            const SUBORDINATORS = new Set(["if", "when", "whenever", "once", "until", "unless", "before", "after"]);

            // Words that can sit between the deciding word and the keyword without
            // changing the reading: adverbs ("may also fix", "will fully fix") and the
            // auxiliaries of the perfect ("would have fixed", "#100 has fixed").
            const INTERVENING = new Set([
              "also", "fully", "completely", "entirely", "actually", "really", "yet", "directly", "properly",
              "have", "has", "had",
            ]);

            // Tokens: { kind: "word", text } (lowercased), { kind: "ref", repository, number, attached }
            // (repository is "owner/repo" lowercased or null for a bare "#1"; attached means the
            // number runs into a word, "#1's"), { kind: "punct", text } (one character),
            // { kind: "newline" } (one line break) and { kind: "break" } (a blank line).

            // Every issue or pull request that `body` says the PR closes, in order
            // of appearance: { repository, number, keyword }. Duplicates, the PR
            // itself and other repositories are not filtered here.
            function findLinkedReferences(body, repository) {
              const self = repository.toLowerCase();
              const tokens = tokenize(stripNonProse(body));
              const found = [];
              let i = 0;
              while (i < tokens.length) {
                const token = tokens[i];
                if (token.kind !== "word" || !KEYWORDS.has(token.text) || !isClosingStatement(tokens, i, token.text)) {
                  i++;
                  continue;
                }
                let j = i + 1;
                if (isPunct(tokens[j], ":")) j++;
                let ref = readReference(tokens, j);
                if (ref === null) {
                  i++;
                  continue;
                }
                for (;;) {
                  found.push({ repository: ref.token.repository ?? self, number: ref.token.number, keyword: token.text });
                  j = ref.end;
                  // "#1, #2", "#1 and #2", "#1, and #2", "#1 & #2"; a list continues past
                  // a line break only after a separator.
                  let k = j;
                  if (isPunct(tokens[k], ",")) k++;
                  if (isWord(tokens[k], "and") || isPunct(tokens[k], "&")) k++;
                  if (k === j) break;
                  if (tokens[k]?.kind === "newline") k++;
                  ref = readReference(tokens, k);
                  if (ref === null) break;
                }
                i = j;
              }
              return found;
            }

            // Whether the keyword at `index` states that the PR closes what follows.
            // Decided by what comes before it.
            function isClosingStatement(tokens, index, keyword) {
              const k = skipInterveningBack(tokens, index - 1);
              const before = tokens[k];
              if (before === undefined) return true;
              // "#100 supersedes #1": another pull request is the subject. A line
              // break ends that reading: "Fixes #1\nFixes #2" is two statements.
              if (endsWithReference(tokens, k)) return false;
              if (before.kind === "newline") {
                // A word wrapped onto the previous line still applies: "does not\nfix #1",
                // "unable to\nfix #1", "#100, which\nfixed #1". A line that starts with
                // "Fix #1" after prose still counts.
                const w = skipInterveningBack(tokens, k - 1);
                const wrapped = tokens[w];
                if (wrapped?.kind !== "word") return true;
                if (DISQUALIFIERS.has(wrapped.text) || isRelativeToReference(tokens, w)) return false;
                return !(BASE_FORMS.has(keyword) && wrapped.text === "to");
              }
              if (before.kind !== "word") return true;
              if (isRelativeToReference(tokens, k)) return false;
              if (DISQUALIFIERS.has(before.text)) return false;
              const prev = tokens[skipInterveningBack(tokens, k - 1)];
              if (prev?.kind === "word" && SUBORDINATORS.has(prev.text)) return false;
              return !BASE_FORMS.has(keyword) || VERB_MARKERS.has(before.text);
            }

            // "which" or "that" at `k` with a reference as its antecedent: "Reverts
            // #100, which fixed #1", "Reverts #100 (which fixed #1)".
            function isRelativeToReference(tokens, k) {
              const word = tokens[k];
              if (word.kind !== "word" || (word.text !== "which" && word.text !== "that")) return false;
              let p = k - 1;
              if (tokens[p]?.kind === "newline") p--;
              if (isPunct(tokens[p], ",") || isPunct(tokens[p], "(")) p--;
              return endsWithReference(tokens, p);
            }

            // Whether a reference ends at `k`: "#100", "(#100)", "**#100**",
            // "[#100](url)" or "[text](issue url)".
            function endsWithReference(tokens, k) {
              let p = k;
              while (p >= 0 && tokens[p].kind === "punct" && (tokens[p].text === "*" || tokens[p].text === "_")) p--;
              const token = tokens[p];
              if (token === undefined) return false;
              if (token.kind === "ref") return true;
              if (!isPunct(token, ")")) return false;
              if (tokens[p - 1]?.kind === "ref" && isPunct(tokens[p - 2], "(")) return true;
              if (!isPunct(tokens[p - 2], "(") || !isPunct(tokens[p - 3], "]")) return false;
              if (tokens[p - 1]?.kind === "ref") return true;
              return tokens[p - 4]?.kind === "ref" && isPunct(tokens[p - 5], "[");
            }

            function skipInterveningBack(tokens, k) {
              while (k >= 0 && tokens[k].kind === "word" && INTERVENING.has(tokens[k].text)) k--;
              return k;
            }

            function isPunct(token, text) {
              return token !== undefined && token.kind === "punct" && token.text === text;
            }

            function isWord(token, text) {
              return token !== undefined && token.kind === "word" && token.text === text;
            }

            // A reference token, or a markdown link `[#1](url)` / `[text](issue url)`,
            // at `index`: { token, end } or null.
            function readReference(tokens, index) {
              const token = tokens[index];
              if (token === undefined) return null;
              if (token.kind === "ref") return token.attached ? null : { token, end: index + 1 };
              if (!isPunct(token, "[")) return null;
              let close = index + 1;
              while (close < tokens.length && close < index + 10 && !isPunct(tokens[close], "]")) {
                if (tokens[close].kind === "newline" || tokens[close].kind === "break") return null;
                close++;
              }
              if (!isPunct(tokens[close], "]") || !isPunct(tokens[close + 1], "(") || !isPunct(tokens[close + 3], ")")) return null;
              const target = tokens[close + 2];
              if (target.kind === "ref" && !target.attached) return { token: target, end: close + 4 };
              const label = tokens[index + 1];
              if (close === index + 2 && label.kind === "ref" && !label.attached) return { token: label, end: close + 4 };
              return null;
            }

            // Removes fenced and indented code blocks, blockquotes, HTML comments, code
            // spans and struck-through text.
            function stripNonProse(body) {
              let text = removeBlocks(body.replaceAll("\r\n", "\n"));
              text = removeSpans(text, "`");
              text = removeSpans(text, "~", 2);
              for (const tag of ["s", "del", "strike"]) text = removeTagged(text, tag);
              return text;
            }

            // Blanks fenced code blocks, indented code blocks, blockquotes and HTML
            // comments in one pass over the lines, so a marker inside one of them opens
            // nothing else: "<!--" in a fence is code, and "```" in a comment is
            // comment. An unclosed comment runs to the end, as in CommonMark. A line
            // after a quote line continues the quote until a blank line or a new block.
            function removeBlocks(text) {
              const kept = [];
              let fence = null;
              let comment = false;
              let indented = false;
              let quote = false;
              let blankBefore = true;
              for (const line of text.split("\n")) {
                let rest = line;
                if (comment) {
                  const end = rest.indexOf("-->");
                  if (end === -1) {
                    kept.push("");
                    continue;
                  }
                  comment = false;
                  rest = rest.slice(end + 3);
                }
                const trimmed = rest.trim();
                if (fence !== null) {
                  if (trimmed.startsWith(fence) && isRunOf(trimmed.slice(fence.length), fence[0])) fence = null;
                  kept.push("");
                  continue;
                }
                const blank = trimmed === "";
                if (blank) {
                  quote = false;
                  blankBefore = true;
                  kept.push("");
                  continue;
                }
                // Four spaces or a tab after a blank line open an indented code block.
                if ((rest.startsWith("    ") || rest.startsWith("\t")) && (blankBefore || indented)) {
                  indented = true;
                  blankBefore = false;
                  kept.push("");
                  continue;
                }
                indented = false;
                blankBefore = false;
                const opening = leadingRun(trimmed, "`") || leadingRun(trimmed, "~");
                // A backtick fence's info string cannot hold a backtick: "```bun test```" is a code span.
                const isFence = opening.length >= 3 && (opening[0] === "~" || !trimmed.slice(opening.length).includes("`"));
                if (isFence) {
                  fence = opening;
                  quote = false;
                  kept.push("");
                  continue;
                }
                if (trimmed.startsWith(">") || (quote && !startsBlock(trimmed))) {
                  quote = true;
                  kept.push("");
                  continue;
                }
                quote = false;
                // A "<!--" inside a code span on this line is code: "Handles `<!--`. Fixes #1".
                const prose = removeSpans(rest, "`");
                let out = "";
                let i = 0;
                while (i < prose.length) {
                  const start = prose.indexOf("<!--", i);
                  if (start === -1) {
                    out += prose.slice(i);
                    break;
                  }
                  out += prose.slice(i, start) + " ";
                  const end = prose.indexOf("-->", start + 4);
                  if (end === -1) {
                    comment = true;
                    break;
                  }
                  i = end + 3;
                }
                kept.push(out);
              }
              return kept.join("\n");
            }

            // A heading, a list item or a rule ends a blockquote's lazy continuation.
            function startsBlock(trimmed) {
              const c = trimmed[0];
              if (c === "#" || c === "-" || c === "*" || c === "+") return true;
              let n = 0;
              while (isDigit(trimmed[n])) n++;
              return n > 0 && (trimmed[n] === "." || trimmed[n] === ")");
            }

            // Removes "<tag>...</tag>" within a paragraph, for the HTML spellings of
            // strikethrough: <s>, <del>, <strike>.
            function removeTagged(text, tag) {
              const lower = text.toLowerCase();
              const open = `<${tag}>`;
              const close = `</${tag}>`;
              let out = "";
              let i = 0;
              while (i < text.length) {
                const start = lower.indexOf(open, i);
                if (start === -1) {
                  out += text.slice(i);
                  break;
                }
                const end = lower.indexOf(close, start + open.length);
                if (end === -1 || end >= nextBlankLine(text, start)) {
                  out += text.slice(i, start + open.length);
                  i = start + open.length;
                  continue;
                }
                out += text.slice(i, start) + " ";
                i = end + close.length;
              }
              return out;
            }

            function leadingRun(text, char) {
              let n = 0;
              while (text[n] === char) n++;
              return text.slice(0, n);
            }

            function isRunOf(text, char) {
              return leadingRun(text, char).length === text.length;
            }

            // Removes the text between a run of `marker` and the next run of the same
            // length in the same paragraph: `code spans` for "`", ~~struck-through
            // text~~ for "~" with `runLength` 2. A run with no closing run stays as it is.
            function removeSpans(text, marker, runLength) {
              let out = "";
              let i = 0;
              while (i < text.length) {
                if (text[i] !== marker) {
                  out += text[i];
                  i++;
                  continue;
                }
                const opening = leadingRun(text.slice(i), marker);
                const limit = nextBlankLine(text, i);
                let close = -1;
                let from = runLength === undefined || opening.length === runLength ? i + opening.length : limit;
                while (from < limit) {
                  const at = text.indexOf(opening, from);
                  if (at === -1 || at >= limit) break;
                  const run = leadingRun(text.slice(at), marker);
                  if (run.length === opening.length) {
                    close = at;
                    break;
                  }
                  from = at + run.length;
                }
                if (close === -1) {
                  out += opening;
                  i += opening.length;
                  continue;
                }
                out += " ";
                i = close + opening.length;
              }
              return out;
            }

            // The index of the first blank line after `from`, or the end of the text.
            function nextBlankLine(text, from) {
              let at = text.indexOf("\n", from);
              while (at !== -1) {
                let j = at + 1;
                while (j < text.length && (text[j] === " " || text[j] === "\t")) j++;
                if (j === text.length || text[j] === "\n") return at;
                at = text.indexOf("\n", j);
              }
              return text.length;
            }

            function tokenize(text) {
              const tokens = [];
              let i = 0;
              while (i < text.length) {
                if (isSpace(text[i])) {
                  let newlines = 0;
                  while (i < text.length && isSpace(text[i])) {
                    if (text[i] === "\n") newlines++;
                    i++;
                  }
                  if (newlines >= 2) tokens.push({ kind: "break" });
                  else if (newlines === 1) tokens.push({ kind: "newline" });
                  continue;
                }
                let end = i + 1;
                while (end < text.length && !isSpace(text[end])) end++;
                tokenizeChunk(text.slice(i, end), tokens);
                i = end;
              }
              return tokens;
            }

            // Splits one whitespace-free chunk into words, references and punctuation.
            function tokenizeChunk(chunk, tokens) {
              let i = 0;
              let afterWord = false;
              while (i < chunk.length) {
                const c = chunk[i];
                if (isLetter(c) || isDigit(c)) {
                  const url = readUrl(chunk, i);
                  if (url !== null) {
                    tokens.push(url.token);
                    i = url.end;
                    afterWord = true;
                    continue;
                  }
                  let end = i + 1;
                  while (end < chunk.length && isWordChar(chunk[end])) end++;
                  while (end > i + 1 && isTrailingPunct(chunk[end - 1])) end--;
                  const word = chunk.slice(i, end);
                  if (chunk[end] === "#" && isOwnerRepo(word)) {
                    const number = readNumber(chunk, end + 1);
                    if (number !== null) {
                      tokens.push({ kind: "ref", repository: word.toLowerCase(), number: number.value, attached: isAttached(chunk, number.end) });
                      i = number.end;
                      afterWord = true;
                      continue;
                    }
                  }
                  tokens.push({ kind: "word", text: word.toLowerCase().replaceAll("\u2019", "'") });
                  i = end;
                  afterWord = true;
                  continue;
                }
                if (c === "#" && !afterWord) {
                  const number = readNumber(chunk, i + 1);
                  if (number !== null) {
                    tokens.push({ kind: "ref", repository: null, number: number.value, attached: isAttached(chunk, number.end) });
                    i = number.end;
                    afterWord = true;
                    continue;
                  }
                }
                tokens.push({ kind: "punct", text: c });
                i++;
                afterWord = false;
              }
            }

            // An http(s) URL at `start` runs to the end of the chunk, minus trailing
            // punctuation. A GitHub issue or pull request URL is a reference. Any
            // other URL is one opaque word.
            function readUrl(chunk, start) {
              const lower = chunk.slice(start).toLowerCase();
              let p;
              if (lower.startsWith("https://")) p = "https://".length;
              else if (lower.startsWith("http://")) p = "http://".length;
              else return null;
              let end = chunk.length;
              while (end > start + p && isTrailingPunct(chunk[end - 1])) end--;
              const url = chunk.slice(start, end);
              const ref = parseGitHubUrl(url.slice(p));
              return { token: ref ?? { kind: "word", text: url }, end };
            }

            // [www.]github.com/owner/repo/(issues|pull)/N[#fragment|?query|/more]
            function parseGitHubUrl(afterScheme) {
              let path = afterScheme;
              if (path.toLowerCase().startsWith("www.")) path = path.slice("www.".length);
              if (!path.toLowerCase().startsWith("github.com/")) return null;
              const segments = path.slice("github.com/".length).split("/");
              if (segments.length < 4) return null;
              const [owner, repo, kind, last] = segments;
              if (!isOwnerRepo(`${owner}/${repo}`)) return null;
              if (kind !== "issues" && kind !== "pull") return null;
              const number = readNumber(last, 0);
              if (number === null) return null;
              const after = last[number.end];
              if (after !== undefined && after !== "#" && after !== "?") return null;
              return { kind: "ref", repository: `${owner}/${repo}`.toLowerCase(), number: number.value, attached: false };
            }

            function readNumber(text, start) {
              let end = start;
              while (end < text.length && isDigit(text[end])) end++;
              if (end === start || end - start > 9) return null;
              const value = Number(text.slice(start, end));
              return value > 0 ? { value, end } : null;
            }

            // "#1's", "#1abc": the number is part of a longer word, not a reference.
            function isAttached(chunk, index) {
              const c = chunk[index];
              return c !== undefined && (isLetter(c) || isDigit(c) || c === "'" || c === "\u2019" || c === "_");
            }

            function isOwnerRepo(text) {
              const parts = text.split("/");
              return parts.length === 2 && parts.every(part => part.length > 0 && [...part].every(isNameChar));
            }

            function isLetter(c) {
              return (c >= "a" && c <= "z") || (c >= "A" && c <= "Z");
            }

            function isDigit(c) {
              return c >= "0" && c <= "9";
            }

            function isNameChar(c) {
              return isLetter(c) || isDigit(c) || c === "-" || c === "_" || c === ".";
            }

            function isWordChar(c) {
              return isNameChar(c) || c === "/" || c === "'" || c === "\u2019";
            }

            function isTrailingPunct(c) {
              return ".,;:!?)]'\"*>-/\u2019".includes(c);
            }

            function isSpace(c) {
              return c.trim() === "";
            }

            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const inputs = context.payload.inputs ?? {};
            const event = context.payload.pull_request;
            const prNumber = event?.number ?? Number(inputs.pr_number);
            const dryRun = String(inputs.dry_run ?? "false") === "true";
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`not a pull request number: ${inputs.pr_number}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (!pr.merged) {
              core.info(`#${prNumber}: not merged, nothing to do`);
              return;
            }
            const defaultBranch = pr.base.repo.default_branch;
            if (pr.base.ref !== defaultBranch) {
              core.info(`#${prNumber}: merged into ${pr.base.ref}, not ${defaultBranch}, nothing to do`);
              return;
            }

            // The description as it was when the PR was merged. Only a manual run
            // reads the current one.
            const body = (event ? event.body : pr.body) ?? "";
            const seen = new Set();
            const targets = [];
            for (const ref of findLinkedReferences(body, repository)) {
              if (ref.repository !== repository.toLowerCase()) {
                core.info(`${ref.repository}#${ref.number}: another repository, skipping`);
                continue;
              }
              if (ref.number === prNumber || seen.has(ref.number)) continue;
              seen.add(ref.number);
              targets.push(ref);
            }
            if (targets.length === 0) {
              core.info(`#${prNumber}: no references to close`);
              return;
            }
            core.info(`#${prNumber}: ${targets.map(ref => `#${ref.number}`).join(", ")}${dryRun ? " (dry run)" : ""}`);

            let failed = 0;
            for (const ref of targets) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: ref.number }));
              } catch (error) {
                // 410: deleted by an admin.
                if (error.status === 404 || error.status === 410) {
                  core.info(`#${ref.number}: does not exist, skipping`);
                  continue;
                }
                failed++;
                core.error(`#${ref.number}: ${error.message}`);
                continue;
              }
              if (issue.state !== "open") {
                core.info(`#${ref.number}: already closed, skipping`);
                continue;
              }
              const isPull = issue.pull_request !== undefined;
              const what = isPull ? "pull request" : "issue";
              if (dryRun) {
                core.info(`#${ref.number}: would close ${what} (${ref.keyword} in #${prNumber})`);
                continue;
              }
              try {
                if (isPull) {
                  await github.rest.pulls.update({ owner, repo, pull_number: ref.number, state: "closed" });
                } else {
                  await github.rest.issues.update({ owner, repo, issue_number: ref.number, state: "closed", state_reason: "completed" });
                }
              } catch (error) {
                failed++;
                core.error(`#${ref.number}: ${error.message}`);
                continue;
              }
              core.info(`#${ref.number}: closed ${what} (${ref.keyword} in #${prNumber})`);
              const comment = isPull ? `Superseded by #${prNumber}.` : `Closed as completed by #${prNumber}.`;
              try {
                await github.rest.issues.createComment({ owner, repo, issue_number: ref.number, body: comment });
              } catch (error) {
                core.warning(`#${ref.number}: closed, but the comment failed: ${error.message}`);
              }
            }
            if (failed > 0) core.setFailed(`${failed} of ${targets.length} references could not be closed`);
