name: docs-samples

permissions:
  contents: read

# Type checks the TypeScript code blocks of docs/ against packages/bun-types. Buildkite starts no pipeline for a pull
# request that changes only docs, and it leaves test/integration/bun-types to GitHub Actions, so this job is the one
# that runs the test.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "packages/bun-types/**"
      - "test/integration/bun-types/docs-samples.*"
      - "src/runtime/cli/init/tsconfig.default.json"
      # The @types/node and undici-types that the test checks with, and the TypeScript that checks.
      - "bun.lock"
      - "test/package.json"
      - "test/bun.lock"
      - ".github/workflows/docs-samples.yml"
  pull_request:
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
      - "packages/bun-types/**"
      - "test/integration/bun-types/docs-samples.*"
      - "src/runtime/cli/init/tsconfig.default.json"
      # The @types/node and undici-types that the test checks with, and the TypeScript that checks.
      - "bun.lock"
      - "test/package.json"
      - "test/bun.lock"
      - ".github/workflows/docs-samples.yml"

env:
  BUN_VERSION: "canary"

jobs:
  docs-samples:
    name: "Docs samples"
    runs-on: ubuntu-latest
    # Advisory while the check is new: a failure is a failed check on the PR, and the workflow run stays green.
    continue-on-error: true
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      # PR pushes supersede earlier runs; main commits always run to completion.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: |
          bun install
          bun install --cwd test
      - name: Type check the code blocks of the docs
        run: bun test test/integration/bun-types/docs-samples.test.ts
