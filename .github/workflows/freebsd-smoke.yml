name: FreeBSD smoke test

# Runs the cross-compiled FreeBSD binary inside a FreeBSD VM to verify it
# actually starts and executes JavaScript. The build itself happens on
# BuildKite (cross-compiled from Linux); this just validates the result.
#
# Triggered manually with a BuildKite artifact URL.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: 'URL to bun-freebsd-x64.zip (from BuildKite artifacts)'
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    name: FreeBSD ${{ matrix.version }} smoke
    strategy:
      fail-fast: false
      matrix:
        version: ['14.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            test/js/bun
            test/harness.ts

      - name: Download bun-freebsd-x64
        if: inputs.artifact_url != ''
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: |
          curl -fsSL "$ARTIFACT_URL" -o bun-freebsd.zip
          mkdir -p ./bin
          unzip -j bun-freebsd.zip -d ./bin
          # Normalize whatever name was in the zip to ./bin/bun.
          for f in ./bin/bun-freebsd-* ./bin/bun-profile; do
            [ -f "$f" ] && mv "$f" ./bin/bun && break
          done
          chmod +x ./bin/bun
          file ./bin/bun

      - name: Run in FreeBSD VM
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          release: ${{ matrix.version }}
          usesh: true
          copyback: false
          run: |
            set -e
            if [ -x ./bin/bun ]; then BUN=./bin/bun;
            else echo "::error::no bun binary found; pass artifact_url"; exit 1; fi
            echo "=== version ==="
            $BUN --revision
            echo "=== eval ==="
            $BUN -e 'console.log("hello from", process.platform, process.arch)'
            echo "=== os ==="
            $BUN -e 'const os=require("os"); console.log(os.type(), os.release(), os.cpus().length, "cpus")'
            echo "=== cpus times probe (#42634) ==="
            sysctl hw.ncpu kern.clockrate
            echo "CLK_TCK: $(getconf CLK_TCK)"
            cat > /tmp/check.js <<'EOF'
            const os = require("os");
            const readCpTimes = () =>
              Bun.spawnSync(["sysctl", "-n", "kern.cp_times"]).stdout.toString().trim().split(/\s+/).map(Number);
            const clkTck = Number(Bun.spawnSync(["getconf", "CLK_TCK"]).stdout.toString().trim());
            const mult = Math.floor(1000 / clkTck);
            const before = readCpTimes();
            const cpus = os.cpus();
            const after = readCpTimes();
            console.log("clkTck:", clkTck, "mult:", mult);
            console.log("cp_times before:", before.join(" "));
            console.log("cp_times after: ", after.join(" "));
            const fields = ["user", "nice", "sys", "irq", "idle"];
            let ok = true;
            for (let i = 0; i < cpus.length; i++) {
              console.log("cpu", i, JSON.stringify(cpus[i].times));
              for (let j = 0; j < fields.length; j++) {
                const v = cpus[i].times[fields[j]];
                const lo = before[i * 5 + j] * mult, hi = after[i * 5 + j] * mult;
                if (!(v >= lo && v <= hi)) { ok = false; console.log("  MISMATCH", fields[j], v, "not in", [lo, hi]); }
              }
            }
            const t = cpus[0].times, sum = t.user + t.nice + t.sys + t.irq + t.idle;
            console.log("cpu0 sum / (uptime*1000):", (sum / (os.uptime() * 1000)).toFixed(3));
            console.log(ok ? "RESULT: times are in milliseconds" : "RESULT: times are NOT scaled to milliseconds");
            process.exit(ok ? 0 : 1);
            EOF
            $BUN /tmp/check.js
            echo "=== fs ==="
            $BUN -e 'require("fs").writeFileSync("/tmp/x","ok"); console.log(require("fs").readFileSync("/tmp/x","utf8"))'
            echo "=== http ==="
            $BUN -e 'const s=Bun.serve({port:0,fetch:()=>new Response("ok")}); fetch("http://localhost:"+s.port).then(r=>r.text()).then(t=>{console.log("got:",t);s.stop();process.exit(t==="ok"?0:1)})'
