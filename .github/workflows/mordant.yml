name: Mordant

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**/*.rs"
      - "src/**/*.classes.ts"
      - "src/codegen/**"
      - "scripts/build/**"
      - "scripts/build.ts"
      - "scripts/rust-mordant.ts"
      - "package.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dylint.toml"
      - "mordant-baseline.toml"
      - ".github/workflows/mordant.yml"
      - ".github/actions/setup-bun/**"
      - ".github/rust-matcher.json"

env:
  BUN_VERSION: "1.3.14"
  LLVM_VERSION_MAJOR: "21"
  DYLINT_VERSION: "6.0.3"
  # Mordant (pinned in Cargo.toml's [workspace.metadata.dylint]) is built with,
  # and lints us using, the nightly named in its own rust-toolchain file, which
  # dylint selects itself; rustup fetches it on demand, so the pin is the only
  # thing to bump. The outer cargo just needs to exist: point it at the
  # runner's stable so rust-toolchain.toml's cross-target list is not installed.
  RUSTUP_TOOLCHAIN: stable
  RUSTUP_AUTO_INSTALL: "1"

jobs:
  mordant:
    name: mordant
    runs-on: ubuntu-latest
    # Advisory while the pack is new: shows up on the PR, does not block it.
    continue-on-error: true
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup system deps
        # Same as clippy.yml: configure needs cmake/ninja and resolves a clang.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${LLVM_VERSION_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build clang-${LLVM_VERSION_MAJOR} lld-${LLVM_VERSION_MAJOR} llvm-${LLVM_VERSION_MAJOR}

      - name: Cache the dylint binaries
        # Compiling cargo-dylint and dylint-link is ~100s; they only change on
        # a DYLINT_VERSION bump.
        id: dylint-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
          key: dylint-bin-${{ runner.os }}-${{ env.DYLINT_VERSION }}

      - name: Build the dylint binaries
        if: steps.dylint-bin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-dylint@"$DYLINT_VERSION" dylint-link@"$DYLINT_VERSION"

      - name: Read the mordant pin
        # The driver dylint builds (~50s) is tied to the nightly that the pinned
        # mordant revision names, so the revision is the right cache key for it.
        id: pin
        run: |
          rev=$(sed -n 's/.*scarletindustries\/mordant", rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Cache the dylint driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dylint_drivers
          key: dylint-driver-${{ runner.os }}-${{ env.DYLINT_VERSION }}-${{ steps.pin.outputs.rev }}

      - name: Enable rustc annotations
        run: echo "::add-matcher::.github/rust-matcher.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: mordant
        run: bun run rust:mordant
