# TODO: Move this to bash scripts intead of Github Actions
# so it can be run from Buildkite, see: .buildkite/scripts/release.sh

name: Release
concurrency: release

env:
  BUN_VERSION: ${{ github.event.inputs.tag || github.event.release.tag_name || 'canary' }}
  BUN_LATEST: ${{ (inputs.is-latest || (github.event_name == 'release' && !github.event.release.prerelease)) && 'true' || 'false' }}

permissions:
  contents: read

on:
  release:
    types:
      - published
  schedule:
    - cron: "0 14 * * *" # every day at 6am PST
  workflow_dispatch:
    inputs:
      is-latest:
        description: Is this the latest release?
        type: boolean
        default: false
      tag:
        type: string
        description: What is the release tag? (e.g. "1.0.2", "canary")
        required: true
      use-docker:
        description: Should Docker images be released?
        type: boolean
        default: false
      use-npm:
        description: Should npm packages be published?
        type: boolean
        default: false
      use-homebrew:
        description: Should binaries be released to Homebrew?
        type: boolean
        default: false
      use-s3:
        description: Should binaries be uploaded to S3?
        type: boolean
        default: false
      use-types:
        description: Should bun-types be published to npm (and, for the latest release, PR'd to DefinitelyTyped)?
        type: boolean
        default: false

jobs:
  sign:
    name: Sign Release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'oven-sh' }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/bun-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup GPG
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.3.14"
      - name: Install Dependencies
        run: bun install
      - name: Sign Release
        run: |
          echo "$GPG_PASSPHRASE" | bun upload-assets -- "$BUN_VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  npm:
    name: Release to NPM
    runs-on: ubuntu-latest
    needs: sign
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.use-npm == 'true' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/bun-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # To workaround issue
          ref: main
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.3.14"
      - name: Install Dependencies
        run: bun install
      - name: Release
        run: bun upload-npm -- "$BUN_VERSION" publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  npm-types:
    name: Release types to NPM
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'oven-sh' && (github.event_name != 'workflow_dispatch' || github.event.inputs.use-types == 'true') }}
    # With id-token, npm publishes through the trusted publisher registered for this
    # repository, workflow file and environment on npmjs.com, and NPM_TOKEN is only a
    # fallback for as long as bun-types has none registered.
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - name: Resolve release tag
        id: tag
        if: ${{ env.BUN_VERSION != 'canary' }}
        run: echo "tag=bun-v${BUN_VERSION#bun-v}" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Empty for canaries, which are built from the commit the run was triggered on.
          ref: ${{ steps.tag.outputs.tag }}
      - name: Pick version
        id: version
        run: |
          if [ "$BUN_VERSION" = canary ]; then
            echo "version=$(jq -r .version package.json)-canary.$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "npm-tag=canary" >> "$GITHUB_OUTPUT"
          elif [ "$BUN_LATEST" = true ]; then
            echo "version=${BUN_VERSION#bun-v}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "bun-types is only published for canary builds and for the latest release"
          fi
      - name: Setup Node.js
        if: ${{ steps.version.outputs.version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Setup Bun
        if: ${{ steps.version.outputs.version != '' }}
        uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.3.14"
      - name: Build
        if: ${{ steps.version.outputs.version != '' }}
        working-directory: packages/bun-types
        env:
          BUN_VERSION: ${{ steps.version.outputs.version }}
        run: bun run build
      - name: Release
        if: ${{ steps.version.outputs.version != '' }}
        working-directory: packages/bun-types
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TAG: ${{ steps.version.outputs.npm-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$(npm view "bun-types@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "bun-types@$VERSION is already published"
            exit 0
          fi
          npm publish --access public --tag "$NPM_TAG" --provenance
  definitelytyped:
    name: Update @types/bun on DefinitelyTyped
    runs-on: ubuntu-latest
    needs: npm-types
    if: ${{ needs.npm-types.outputs.npm-tag == 'latest' }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.npm-types.outputs.version }}
    steps:
      - name: Checkout DefinitelyTyped
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DefinitelyTyped/DefinitelyTyped
          persist-credentials: false
      - name: Update types/bun/package.json
        run: |
          jq --indent 4 --arg version "$VERSION" --arg types_version "${VERSION%.*}.9999" \
            '.version = $types_version | .dependencies["bun-types"] = $version' \
            types/bun/package.json > package.json.tmp
          mv package.json.tmp types/bun/package.json
      - name: Open pull request
        env:
          # Pushes the branch to the oven-sh/DefinitelyTyped fork. The push also carries
          # every upstream commit the fork is missing, some of which edit DefinitelyTyped's
          # own workflow files, so this token needs the workflows permission: give it
          # contents + workflows on that one repository (fine-grained PAT or app token) and
          # nothing else.
          FORK_TOKEN: ${{ secrets.DEFINITELYTYPED_FORK_TOKEN }}
          # Opens the pull request on DefinitelyTyped/DefinitelyTyped. Writing to a repository
          # outside the token owner's own account or organization takes a classic PAT; the
          # public_repo scope is enough, as it is for the homebrew push below.
          GH_TOKEN: ${{ secrets.ROBOBUN_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "DefinitelyTyped already depends on bun-types@$VERSION"
            exit 0
          fi
          branch="bun-v$VERSION"
          title="[bun] update to $VERSION"
          git -c user.name=robobun -c user.email=robobun@oven.sh commit --all --message "$title"
          git push --force "https://x-access-token:${FORK_TOKEN}@github.com/oven-sh/DefinitelyTyped" "HEAD:refs/heads/$branch"
          existing=$(gh api "repos/DefinitelyTyped/DefinitelyTyped/pulls?state=open&head=oven-sh:$branch" --jq '.[].html_url')
          if [ -n "$existing" ]; then
            echo "Updated $existing"
            exit 0
          fi
          # Not `gh pr create`: its --head does not accept an organization-owned fork (cli/cli#10093).
          gh api --method POST repos/DefinitelyTyped/DefinitelyTyped/pulls --jq .html_url \
            --raw-field base=master \
            --raw-field head="oven-sh:$branch" \
            --raw-field title="$title" \
            --raw-field body="$(printf '%s\n\n%s' "Update \`bun-types\` to $VERSION." "https://bun.com/blog/bun-v$VERSION")"
  docker:
    name: Release to Dockerhub
    runs-on: ubuntu-latest
    needs: sign
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.use-docker == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            suffix: ""
          - variant: debian
            suffix: -debian
          - variant: slim
            suffix: -slim
            dir: debian-slim
          - variant: alpine
            suffix: -alpine
          - variant: distroless
            suffix: -distroless
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker emulator
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - id: buildx
        name: Setup Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          platforms: linux/amd64,linux/arm64
      - id: metadata
        name: Setup Docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: oven/bun
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ env.BUN_LATEST == 'true' && matrix.suffix == '' }}
            type=raw,value=${{ matrix.variant }},enable=${{ env.BUN_LATEST == 'true' }}
            type=match,pattern=(bun-v)?(canary|\d+.\d+.\d+),group=2,value=${{ env.BUN_VERSION }},suffix=${{ matrix.suffix }}
            type=match,pattern=(bun-v)?(canary|\d+.\d+),group=2,value=${{ env.BUN_VERSION }},suffix=${{ matrix.suffix }}
            type=match,pattern=(bun-v)?(canary|\d+),group=2,value=${{ env.BUN_VERSION }},suffix=${{ matrix.suffix }}
      - name: Login to Docker
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./dockerhub/${{ matrix.dir || matrix.variant }}
          platforms: linux/amd64,linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
  homebrew:
    name: Release to Homebrew
    runs-on: ubuntu-latest
    needs: sign
    permissions:
      contents: read
    if: ${{ github.event_name == 'release' || github.event.inputs.use-homebrew == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oven-sh/homebrew-bun
          persist-credentials: false
      - name: Setup GPG
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_committer_name: robobun
          git_committer_email: robobun@oven.sh
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "2.6"
      - name: Update Tap
        run: ruby scripts/release.rb "$BUN_VERSION"
      - name: Commit Tap
        env:
          ROBOBUN_TOKEN: ${{ secrets.ROBOBUN_TOKEN }}
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Release $BUN_VERSION"
          git push "https://x-access-token:${ROBOBUN_TOKEN}@github.com/oven-sh/homebrew-bun" HEAD:main
  s3:
    name: Upload to S3
    runs-on: ubuntu-latest
    needs: sign
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.use-s3 == 'true' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/bun-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.3.14"
      - name: Install Dependencies
        run: bun install
      - name: Release
        run: bun upload-s3 -- "$BUN_VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          AWS_BUCKET: bun
