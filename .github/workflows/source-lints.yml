name: source-lints

permissions:
  contents: read

# Source-tree lints and build-script unit tests from test/internal/source-lints/.
# These never touch the built bun binary (no bun:internal-for-testing, no
# bunExe() spawns), so they can run against a released bun immediately on push
# instead of waiting for build-bun in every Buildkite test lane.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**/*.rs"
      - "src/**/*.h"
      - "src/**/*.cpp"
      - "src/**/*.bind.ts"
      - "src/codegen/**"
      - "src/js/**/*.ts"
      - "src/jsc/bindings/**"
      - "packages/bun-types/redis.d.ts"
      - "scripts/build/**"
      - "scripts/glob-sources.ts"
      - "scripts/agent.ts"
      - "scripts/buildkite.ts"
      - ".buildkite/ci.ts"
      - ".buildkite/scripts/upload-release.sh"
      - "packages/bun-release/src/platform.ts"
      - "rust-toolchain.toml"
      - "bun.lock"
      - "test/bun.lock"
      - "test/harness.ts"
      - "test/tsconfig.json"
      - "test/_util/**"
      - "test/internal/source-lints/**"
      - "test/aot/**"
      - ".gitignore"
      - ".prettierignore"
      - ".github/workflows/*.yml"
      - ".github/actions/setup-bun/**"
  pull_request:
    paths:
      - "src/**/*.rs"
      - "src/**/*.h"
      - "src/**/*.cpp"
      - "src/**/*.bind.ts"
      - "src/codegen/**"
      - "src/js/**/*.ts"
      - "src/jsc/bindings/**"
      - "packages/bun-types/redis.d.ts"
      - "scripts/build/**"
      - "scripts/glob-sources.ts"
      - "scripts/agent.ts"
      - "scripts/buildkite.ts"
      - ".buildkite/ci.ts"
      - ".buildkite/scripts/upload-release.sh"
      - "packages/bun-release/src/platform.ts"
      - "rust-toolchain.toml"
      - "bun.lock"
      - "test/bun.lock"
      - "test/harness.ts"
      - "test/tsconfig.json"
      - "test/_util/**"
      - "test/internal/source-lints/**"
      - "test/aot/**"
      - ".gitignore"
      - ".prettierignore"
      - ".github/workflows/*.yml"
      - ".github/actions/setup-bun/**"
  merge_group:

env:
  BUN_VERSION: "1.4.4"

jobs:
  source-lints:
    name: "Source lints"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      # PR pushes supersede earlier runs; main commits always run to completion.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Fetch the engine's code generators
        # A lint that loads a schema loads the code generators, which import TypeScript of the engine. A release of WebKit
        # has it as an asset of its own; an older one only inside its tarballs.
        run: |
          version=$(sed -n 's/^export const WEBKIT_VERSION = "\(.*\)";$/\1/p' scripts/build/deps/webkit.ts)
          release="https://github.com/oven-sh/WebKit/releases/download/autobuild-${version#autobuild-}"
          mkdir -p vendor/WebKit
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/engine.tar.gz" "$release/bun-webkit-aot-sources.tar.gz" ||
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/engine.tar.gz" "$release/bun-webkit-linux-amd64-lto.tar.gz"
          tar -xzf "$RUNNER_TEMP/engine.tar.gz" -C vendor/WebKit --strip-components=1 --exclude=bun-webkit/Source/JavaScriptCore/aot/tests bun-webkit/Source/JavaScriptCore/aot
      # No `bun install`: every test here imports only built-ins, relative
      # paths, or `harness` (resolved via test/tsconfig.json `paths`).
      - name: Run source lints
        run: bun test test/internal/source-lints/
