name: source-lints

permissions:
  contents: read

# Source-tree lints and build-script unit tests from test/internal/source-lints/.
# These never touch the built bun binary (no bun:internal-for-testing, no
# bunExe() spawns), so they can run against a released bun immediately on push
# instead of waiting for build-bun in every Buildkite test lane.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**/*.rs"
      - "src/**/*.h"
      - "src/**/*.cpp"
      - "src/**/*.bind.ts"
      - "src/codegen/**"
      - "src/js/builtins.d.ts"
      - "src/jsc/bindings/**"
      - "packages/bun-types/redis.d.ts"
      - "scripts/build/**"
      - "scripts/glob-sources.ts"
      - "scripts/agent.ts"
      - "scripts/buildkite.ts"
      - ".buildkite/ci.ts"
      - "rust-toolchain.toml"
      - "**/Cargo.toml"
      - "bun.lock"
      - "test/bun.lock"
      - "test/harness.ts"
      - "test/tsconfig.json"
      - "test/_util/**"
      - "test/internal/source-lints/**"
      - ".github/workflows/*.yml"
      - ".github/actions/setup-bun/**"
  pull_request:
    paths:
      - "src/**/*.rs"
      - "src/**/*.h"
      - "src/**/*.cpp"
      - "src/**/*.bind.ts"
      - "src/codegen/**"
      - "src/js/builtins.d.ts"
      - "src/jsc/bindings/**"
      - "packages/bun-types/redis.d.ts"
      - "scripts/build/**"
      - "scripts/glob-sources.ts"
      - "scripts/agent.ts"
      - "scripts/buildkite.ts"
      - ".buildkite/ci.ts"
      - "rust-toolchain.toml"
      - "**/Cargo.toml"
      - "bun.lock"
      - "test/bun.lock"
      - "test/harness.ts"
      - "test/tsconfig.json"
      - "test/_util/**"
      - "test/internal/source-lints/**"
      - ".github/workflows/*.yml"
      - ".github/actions/setup-bun/**"
  merge_group:

env:
  BUN_VERSION: "1.4.4"

jobs:
  source-lints:
    name: "Source lints"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      # PR pushes supersede earlier runs; main commits always run to completion.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # No `bun install`: every test here imports only built-ins, relative
      # paths, or `harness` (resolved via test/tsconfig.json `paths`), so a
      # bare checkout is sufficient.
      #
      # workspace-lints.test.ts runs `cargo metadata` on the crates outside the
      # workspace, and skips that test where no cargo runs: `cargo --version`
      # fails this step first. The test takes RUSTUP_TOOLCHAIN from here. The
      # stable cargo of the runner image can load those crates, so the job does
      # not install the nightly that rust-toolchain.toml pins.
      - name: Run source lints
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo --version
          bun test test/internal/source-lints/
