name: source-lints

permissions:
  contents: read

# All of test/internal/: source-tree lints, build-script unit tests, and
# internal-API smoke tests. These run against a released bun on push instead
# of being repeated across every Buildkite test lane (excluded there via
# .buildkite/ci.mjs).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**/*.rs"
      - "src/jsc/bindings/**"
      - "scripts/**"
      - "test/harness.ts"
      - "test/tsconfig.json"
      - "test/_util/**"
      - "test/internal/**"
      - ".github/workflows/source-lints.yml"
      - ".github/actions/setup-bun/**"
  pull_request:
    paths:
      - "src/**/*.rs"
      - "src/jsc/bindings/**"
      - "scripts/**"
      - "test/harness.ts"
      - "test/tsconfig.json"
      - "test/_util/**"
      - "test/internal/**"
      - ".github/workflows/source-lints.yml"
      - ".github/actions/setup-bun/**"
  merge_group:

env:
  BUN_VERSION: "1.3.14"

jobs:
  source-lints:
    name: "Source lints"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      # PR pushes supersede earlier runs; main commits always run to completion.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup Dependencies
        # oxlint-plugin-bun.test.ts needs node_modules/oxlint from devDependencies.
        run: bun install --frozen-lockfile
      - name: Run test/internal
        env:
          # Enable bun:internal-for-testing in release builds. The env var is
          # only read when BUN_GARBAGE_COLLECTOR_LEVEL is also set.
          BUN_FEATURE_FLAG_INTERNAL_FOR_TESTING: "1"
          BUN_GARBAGE_COLLECTOR_LEVEL: "0"
        run: bun test test/internal/
