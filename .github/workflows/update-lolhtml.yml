name: Update lolhtml

# bun builds oven-sh/lol-html, a fork of cloudflare/lol-html that adds
# content-handler suspension (`HtmlRewriter::resume()`). LOLHTML_COMMIT in
# scripts/build/deps/lolhtml.ts is a commit of the fork, and bun does not
# compile against upstream, so this workflow cannot bump the pin the way the
# other update-*.yml workflows do: someone has to rebase the fork's `bun` branch
# onto the new upstream tag first.
#
# What it does instead: compare upstream's latest release with
# LOLHTML_UPSTREAM_BASE, the upstream commit the fork is rebased onto, and open
# one issue per upstream release that the base does not contain.
#
# test/internal/source-lints/update-lolhtml.test.ts runs the script below
# against a fake API.

permissions:
  contents: read

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

jobs:
  check-update:
    if: github.repository == 'oven-sh/bun'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open an issue if the fork is behind upstream
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const DEP_FILE = "scripts/build/deps/lolhtml.ts";
            const upstream = { owner: "cloudflare", repo: "lol-html" };

            const base = require("node:fs")
              .readFileSync(DEP_FILE, "utf8")
              .match(/^const LOLHTML_UPSTREAM_BASE = "([0-9a-f]{40})";/m)?.[1];
            if (!base) {
              core.setFailed(`Could not find LOLHTML_UPSTREAM_BASE in ${DEP_FILE}`);
              return;
            }

            const { data: release } = await github.rest.repos.getLatestRelease(upstream);
            const tag = release.tag_name;
            if (!/^[\w.-]+$/.test(tag)) {
              core.setFailed(`Unexpected tag name from ${upstream.owner}/${upstream.repo}: ${JSON.stringify(tag)}`);
              return;
            }

            // A lightweight tag points at the commit. An annotated tag points at a tag object that does.
            const { data: ref } = await github.rest.git.getRef({ ...upstream, ref: `tags/${tag}` });
            let latest = ref.object.sha;
            if (ref.object.type === "tag") {
              const { data: annotated } = await github.rest.git.getTag({ ...upstream, tag_sha: latest });
              latest = annotated.object.sha;
            }

            // The base is not always a tag: 77127cd2 was v2.7.2 plus one Cargo.lock commit. So ask
            // whether the base contains the release, not whether the two are the same commit.
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...upstream,
              basehead: `${base}...${latest}`,
              per_page: 1,
            });
            if (comparison.status === "identical" || comparison.status === "behind") {
              core.info(`The fork's upstream base ${base} contains ${tag} (${latest}). Nothing to do.`);
              return;
            }

            // One issue per release, open or closed: a release that was skipped on purpose stays closed.
            const { owner, repo } = context.repo;
            const title = `deps: rebase the lol-html fork onto ${tag}`;
            const { data: found } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:title "${title}"`,
            });
            const existing = found.items.find(issue => issue.title === title);
            if (existing) {
              core.info(`#${existing.number} already tracks ${tag}. Nothing to do.`);
              return;
            }

            const body = [
              `cloudflare/lol-html released [${tag}](${release.html_url}).`,
              "",
              "bun builds the fork [oven-sh/lol-html](https://github.com/oven-sh/lol-html) (branch `bun`), which adds content-handler suspension to upstream.",
              `\`${DEP_FILE}\` records the upstream commit that the fork is rebased onto, \`LOLHTML_UPSTREAM_BASE\`, as \`${base}\`.`,
              `That commit does not contain ${tag}: https://github.com/cloudflare/lol-html/compare/${base}...${latest}`,
              "",
              "To update:",
              "",
              `1. In oven-sh/lol-html, fetch \`${tag}\` from upstream and run \`git rebase --onto ${tag} ${base} bun\`. Run \`cargo test\`, then push the branch.`,
              `2. In \`${DEP_FILE}\`, set \`LOLHTML_COMMIT\` to the new head of \`bun\` and \`LOLHTML_UPSTREAM_BASE\` to \`${latest}\`.`,
              "3. Update the `lol_html` entry in `Cargo.lock`. The build runs cargo with `--locked`.",
              "",
              "Do not set `LOLHTML_COMMIT` to an upstream commit. `src/runtime/api/html_rewriter.rs` needs `HtmlRewriter::resume()`, and only the fork has it.",
              "",
              `Opened by [this workflow](https://github.com/${owner}/${repo}/actions/workflows/update-lolhtml.yml).`,
            ].join("\n");
            const { data: issue } = await github.rest.issues.create({ owner, repo, title, body });
            core.info(`Opened #${issue.number}: ${title}`);
