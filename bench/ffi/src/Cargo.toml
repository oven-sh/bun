[package]
edition = "2021"
version = "0.1.0"
name = "ffi_napi_bench"

# Standalone benchmark: opt out of the repo-root [workspace].
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = []
enable-napi = []

[dependencies]
napi = "2"
napi-derive = "2"

[build-dependencies]
napi-build = "2.0.1"