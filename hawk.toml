# Hawk (https://github.com/astral-sh/hawk) cross-crate dead-code analysis config.
#
# The analysis targets the shipped surface: a release-profile compile of the
# workspace for each of the 11 targets Bun ships, unioned so an item used on
# any platform is treated as live. `bun_runtime` is analyzed through a throwaway
# `bun_hawk_root` bin (see tools/hawk/); the real reachability roots are the
# #[no_mangle] exports, which Hawk pins automatically.

targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "aarch64-linux-android",
  "x86_64-linux-android",
  "x86_64-unknown-freebsd",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]

# Analyze the shipped surface: release across all targets.
# (asan-release x linux-x64 will be added once profiles can pin their own targets.)
[[feature-profile]]
name = "release"
cargo-profile = "release"

# The workspace doctest pass hits a pre-existing latent bug in bun_http's
# ref-count derive under --release (E0407, reproduces on main); scope the pass
# to a crate whose doc examples build so the analysis can complete.
[[doctest]]
package = "bun_semver"

[[production]]
package = "bun_runtime"
bin = "bun_hawk_root"
reason = "throwaway analysis root; real roots are the #[no_mangle] exports"

# `// HOST_EXPORT(...)` fns are scraped by src/codegen/generate-host-exports.ts
# and must stay `pub fn`.
[[root-marker]]
comment = "HOST_EXPORT("
reason = "codegen-scraped host export"

# Group A: enum variants whose discriminants form external code tables (kept on purpose).
[[override]]
lint = "hawk::dead_public"
crate = "bun_http_types"
item = "h2::FrameType::HTTP_FRAME_ALTSVC"
kind = "enum_variant"
level = "expect"
reason = "external code table: HTTP/2 frame type numbering"

[[override]]
lint = "hawk::dead_public"
crate = "bun_http_types"
item = "h2::FrameType::HTTP_FRAME_ORIGIN"
kind = "enum_variant"
level = "expect"
reason = "external code table: HTTP/2 frame type numbering"

