[package]
name = "brotli-differential"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "harness"
path = "src/main.rs"

[[bin]]
name = "fuzz_dec"
path = "src/fuzz_dec.rs"
required-features = ["libfuzzer"]

[[bin]]
name = "fuzz_enc"
path = "src/fuzz_enc.rs"
required-features = ["libfuzzer"]

[features]
libfuzzer = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "=0.4.13", optional = true }
bun_brotli = { path = "../../src/brotli" }

[profile.release]
debug = "line-tables-only"
overflow-checks = false
codegen-units = 1

[profile.dev]
opt-level = 1

[workspace]
