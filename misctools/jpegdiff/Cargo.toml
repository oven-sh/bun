[package]
name = "jpegdiff"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
bun_jpeg = { path = "../../src/jpeg" }

[profile.release]
debug = "line-tables-only"
overflow-checks = true
debug-assertions = true

[profile.fast]
inherits = "release"
overflow-checks = false
debug-assertions = false
