[package]
name = "bun_desktop"
version = "0.0.0"
edition = "2024"
publish = false

# Not a member of Bun's workspace: it has its own lockfile, unwinds on panic, and is loaded with dlopen.
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["font-crates"]
font-crates = ["dep:harfrust", "dep:skrifa"]
# `text/{sfnt,shaper,autohint}` in place of those. `text/own` has the modules that differ.
own-fonts = []

[[example]]
name = "compare_fonts"
required-features = ["font-crates", "own-fonts"]

[dependencies]
harfrust = { version = "0.12", optional = true }
skrifa = { version = "0.44", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

# Less to load. What paints, shapes and decodes is listed below.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package]
harfrust.opt-level = 3
read-fonts.opt-level = 3
skrifa.opt-level = 3
font-types.opt-level = 3
