[package]
name = "bun-native-plugin"
description = "Rustified wrapper for writing native plugins for Bun."
license = "MIT"
version = "0.2.0"
edition = "2021"

# Standalone crates: opt out of the repo-root [workspace]. bun-macro is a
# member, so it must not get a [workspace] table of its own. A workspace that
# holds a copy of this directory names the copy in its `workspace.exclude`.
[workspace]
members = ["bun-macro"]

[dependencies]
anyhow = "1.0.94"
# use local path in dev and publish to crates.io in prod
bun-macro = { path = "./bun-macro", version = "0.1.0" }


