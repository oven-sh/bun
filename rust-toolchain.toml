[toolchain]
channel = "nightly-2026-11-14"
# rust-src is needed for -Zbuild-std, which every build uses. miri is for `bun run rust:miri`.
# targets mirrors `allRustTargets` in scripts/build/rust.ts: prebuilt std for `bun run rust:check-all`,
# `cargo check --target` and rust-analyzer on any host.
# CI's images install this same channel with these components and targets, from
# scripts/build/ci-images/spec.ts; a source lint keeps the two files in step.
# rustup ignores this whole file when RUSTUP_TOOLCHAIN is set, as the build does.
# llvm-tools: rustc's own llvm-nm, llvm-objdump, llvm-profdata and the rest, for looking at
# what it emits. The build does not use them.
components = ["rust-src", "rustfmt", "clippy", "miri", "llvm-tools"]
targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "aarch64-linux-android",
  "x86_64-linux-android",
  "aarch64-unknown-freebsd",
  "x86_64-unknown-freebsd",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
