[package]
name = "bun_aot"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
path = "lib.rs"

[[test]]
name = "ir_tests"
path = "tests/ir_tests.rs"

[features]
linked_names = ["bun_aot_builtins/linked_names"]

[dependencies]
bun_aot_builtins.workspace = true
bun_aot_interface.workspace = true
bun_sema.workspace = true
bun_sema_driver.workspace = true
bun_sema_parser.workspace = true
bun_builtin_sources.workspace = true
bun_lint.workspace = true
bun_lint_react_compiler.workspace = true
bun_react_compiler = { path = "../react_compiler" }
bun_resolve_builtins.workspace = true
bun_options_types.workspace = true
bun_removable_features.workspace = true
bun_collections.workspace = true
bun_core.workspace = true
bun_ast.workspace = true
bun_alloc.workspace = true
bun_base64.workspace = true
bun_glob.workspace = true
bun_trim.workspace = true
bun_paths.workspace = true
bun_sys.workspace = true
bun_threading.workspace = true
bun_zstd.workspace = true
bstr.workspace = true
bitflags.workspace = true
rustc-hash = "2"
hashbrown.workspace = true
smallvec.workspace = true

[dev-dependencies]
# The native symbols that Bun's C and C++ side provides to `bun_core`.
bun_sema_standalone = { path = "../sema/standalone" }

[lints]
workspace = true
