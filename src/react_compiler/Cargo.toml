[package]
name = "bun_react_compiler"
version.workspace = true
edition.workspace = true

[lib]
path = "lib.rs"

[features]
# Fixture-harness support: test-only `// @pragma` parsing, the pragma-gated
# passes (outline_jsx, name_anonymous_functions), BUN_REACT_COMPILER_TIMING and
# BUN_REACT_COMPILER_DUMP_HIR. None of this is reachable from `Bun.build()` or
# `bun lint`; gating it lets LTO drop it from release binaries.
fixtures = []

[lints]
workspace = true

[dependencies]
bun_ast = { path = "../ast" }
bun_alloc.workspace = true
bun_core.workspace = true
bun_collections.workspace = true
rustc-hash = "2"
enumset.workspace = true
smallvec.workspace = true
