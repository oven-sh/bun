[package]
name = "bun_runtime"
version.workspace = true
edition.workspace = true

[lib]
path = "lib.rs"
# The final Rust artifact: a staticlib the native build links together with the
# C/C++ objects (see scripts/build/rust.ts). Being the leaf staticlib itself,
# rather than an rlib consumed by a separate shim crate, means rustc never
# encodes crate metadata for this (by far the largest) crate and cargo never
# re-bundles every rlib into a second archive on each rebuild.
crate-type = ["staticlib"]

[lints]
workspace = true

[dependencies]
bun_opaque.workspace = true
rust-argon2.workspace = true
bcrypt.workspace = true
getrandom.workspace = true
# Pure-Zig stdlib hash backends (std.crypto.hash.{sha3,blake2}) — per
# docs/PORTING.md, prefer a vetted crates.io impl over hand-porting Keccak/Blake2.
sha3 = { version = "0.10", default-features = false }
blake2 = { version = "0.10", default-features = false }
bytemuck = "1"
thiserror.workspace = true
strum.workspace = true
