[package]
name = "bun_sema"
version.workspace = true
edition.workspace = true

[lib]
path = "lib.rs"

[features]
# The `.types` and `.symbols` baseline writers. `bun_sema_baselines` enables it and `bun_runtime` depends on that crate, so
# every build of Bun compiles it. Only `bun check --run-typescript-tests` of a canary or debug build runs it.
baselines = []

[dependencies]
bun_alloc.workspace = true
bun_collections.workspace = true
bun_core.workspace = true
bun_paths.workspace = true
bun_threading.workspace = true
bun_wyhash.workspace = true
bun_zstd.workspace = true
bstr.workspace = true
hashbrown.workspace = true
rustc-hash = "2"
smallvec.workspace = true
bitflags.workspace = true

[dev-dependencies]
# The native symbols that Bun's C and C++ side provides to `bun_core`.
bun_sema_standalone = { path = "standalone" }

[lints]
workspace = true
