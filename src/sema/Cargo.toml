[package]
name = "bun_sema"
version.workspace = true
edition.workspace = true

[lib]
path = "lib.rs"

[features]
# The `.types` and `.symbols` baseline writers. Test-only: enabled by `bun_sema_standalone`, never by the product.
baselines = []

[dependencies]
bun_alloc.workspace = true
bun_collections.workspace = true
bun_core.workspace = true
bun_paths.workspace = true
bun_semver.workspace = true
bun_threading.workspace = true
bstr.workspace = true
hashbrown.workspace = true
rustc-hash = "2"
smallvec.workspace = true
bitflags.workspace = true

[dev-dependencies]
# The native symbols that Bun's C and C++ side provides to `bun_core`.
bun_sema_standalone = { path = "standalone" }

[lints]
workspace = true
