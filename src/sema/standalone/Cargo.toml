[package]
name = "bun_sema_standalone"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
path = "lib.rs"

[[bin]]
name = "bun-sema"
path = "main.rs"

[features]
# What only the tests of other crates use.
test_support = ["bun_sema/test_support", "bun_threading/test_support"]

[dependencies]
bun_sema_parser.workspace = true
bun_sema = { workspace = true, features = ["baselines"] }
bun_sema_driver.workspace = true
bun_sema_baselines.workspace = true
bun_js_parser.workspace = true
bun_threading.workspace = true
bun_alloc.workspace = true
bun_core.workspace = true
bun_sys.workspace = true
bun_zstd.workspace = true
bun_boringssl_sys.workspace = true
libc.workspace = true
bstr.workspace = true

[build-dependencies]
cc = "1"

[lints]
workspace = true
