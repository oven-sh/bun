[package]
name = "bun_simd"
version.workspace = true
edition.workspace = true

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
default = ["alloc"]
# What fills a Vec.
alloc = []
# The tests that take minutes to compile, each.
slow-tests = []

# It depends on nothing of Bun.
[dependencies]
bun_simd_macros.workspace = true

