[package]
name = "bun_webgpu"
version.workspace = true
edition.workspace = true

[lib]
path = "lib.rs"

[lints]
workspace = true

# wgpu-core is the WebGPU validation layer plus the native backends (the same
# crate Firefox and Deno embed). Each OS table below enables exactly one backend.
[dependencies]
wgpu-core = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
wgpu-types = { version = "30.0.1", default-features = false, features = ["std"] }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "freebsd"))'.dependencies]
wgpu-core = { version = "30.0.1", default-features = false, features = ["vulkan"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu-core = { version = "30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
wgpu-core = { version = "30.0.1", default-features = false, features = ["dx12"] }
