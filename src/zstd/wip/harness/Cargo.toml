[package]
name = "zstd_harness"
version = "0.0.0"
edition = "2024"

[dependencies]
bun_zstd = { path = "zstd-pub" }

[profile.release]
debug = "line-tables-only"
overflow-checks = true
debug-assertions = true
panic = "abort"

[profile.bench]
codegen-units = 1
inherits = "release"
overflow-checks = false
debug-assertions = false

[workspace]
