[workspace]

[package]
name = "tracker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tracker"
path = "src/main.rs"

[[bin]]
name = "pieces"
path = "../../pieces/main.rs"

[dependencies]
axum = "0.8"
deadpool-postgres = "0.14"
form_urlencoded = "1"
getrandom = "0.4"
hmac = "0.13"
itoa = "1"
mimalloc = { version = "0.1", default-features = false }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
