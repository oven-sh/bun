# Coverage-guided fuzzers for `bun format`, `bun lint` and the parser. See README.md.
#
# Not a member of Bun's workspace: it is built with other flags (sanitizers, overflow checks) and
# links the crates it tests without the rest of Bun.
cargo-features = ["profile-rustflags"]

[workspace]

[package]
name = "bun_fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[[bin]]
name = "fuzz_format"
path = "format.rs"

[[bin]]
name = "fuzz_lint"
path = "lint.rs"

[[bin]]
name = "fuzz_parser"
path = "parser.rs"

[dependencies]
libfuzzer-sys = "0.4"
bun_format = { path = "../../../../../../src/format" }
bun_md = { path = "../../../../../../src/md" }
bun_lint = { path = "../../../../../../src/lint" }
bun_lint_eslint = { path = "../../../../../../src/lint/eslint" }
bun_lint_typescript = { path = "../../../../../../src/lint/typescript" }
bun_lint_plugins = { path = "../../../../../../src/lint/plugins" }
bun_lint_driver = { path = "../../../../../../src/lint/driver" }
bun_sema = { path = "../../../../../../src/sema" }
bun_sema_parser = { path = "../../../../../../src/sema/parser" }
bun_js_parser = { path = "../../../../../../src/js_parser" }
bun_threading = { path = "../../../../../../src/threading" }
bun_core = { path = "../../../../../../src/bun_core" }
bstr = { version = "1", default-features = false, features = ["alloc"] }
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bun_sema_mimalloc)'] }

# For both profiles.
[profile.release]
opt-level = 3
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
# A panic is caught, written down with the input and the place, and the fuzzer goes on.
panic = "unwind"
codegen-units = 16
incremental = false

# libFuzzer is told what is reached in the crates that are tested, and in no other: it looks at every counter after every
# input.
[profile.fuzz]
inherits = "release"

[profile.fuzz.package.bun_format]
rustflags = ["-Cpasses=sancov-module", "-Cllvm-args=-sanitizer-coverage-level=4", "-Cllvm-args=-sanitizer-coverage-inline-8bit-counters", "-Cllvm-args=-sanitizer-coverage-pc-table", "-Cllvm-args=-sanitizer-coverage-trace-compares", "-Cllvm-args=-simplifycfg-branch-fold-threshold=0"]

[profile.fuzz.package.bun_md]
rustflags = ["-Cpasses=sancov-module", "-Cllvm-args=-sanitizer-coverage-level=4", "-Cllvm-args=-sanitizer-coverage-inline-8bit-counters", "-Cllvm-args=-sanitizer-coverage-pc-table", "-Cllvm-args=-sanitizer-coverage-trace-compares", "-Cllvm-args=-simplifycfg-branch-fold-threshold=0"]

[profile.fuzz.package.bun_lint]
rustflags = ["-Cpasses=sancov-module", "-Cllvm-args=-sanitizer-coverage-level=4", "-Cllvm-args=-sanitizer-coverage-inline-8bit-counters", "-Cllvm-args=-sanitizer-coverage-pc-table", "-Cllvm-args=-sanitizer-coverage-trace-compares", "-Cllvm-args=-simplifycfg-branch-fold-threshold=0"]

[profile.fuzz.package.bun_lint_eslint]
rustflags = ["-Cpasses=sancov-module", "-Cllvm-args=-sanitizer-coverage-level=4", "-Cllvm-args=-sanitizer-coverage-inline-8bit-counters", "-Cllvm-args=-sanitizer-coverage-pc-table", "-Cllvm-args=-sanitizer-coverage-trace-compares", "-Cllvm-args=-simplifycfg-branch-fold-threshold=0"]

[profile.fuzz.package.bun_lint_typescript]
rustflags = ["-Cpasses=sancov-module", "-Cllvm-args=-sanitizer-coverage-level=4", "-Cllvm-args=-sanitizer-coverage-inline-8bit-counters", "-Cllvm-args=-sanitizer-coverage-pc-table", "-Cllvm-args=-sanitizer-coverage-trace-compares", "-Cllvm-args=-simplifycfg-branch-fold-threshold=0"]

[profile.fuzz.package.bun_lint_plugins]
rustflags = ["-Cpasses=sancov-module", "-Cllvm-args=-sanitizer-coverage-level=4", "-Cllvm-args=-sanitizer-coverage-inline-8bit-counters", "-Cllvm-args=-sanitizer-coverage-pc-table", "-Cllvm-args=-sanitizer-coverage-trace-compares", "-Cllvm-args=-simplifycfg-branch-fold-threshold=0"]

[profile.fuzz.package.bun_sema_parser]
rustflags = ["-Cpasses=sancov-module", "-Cllvm-args=-sanitizer-coverage-level=4", "-Cllvm-args=-sanitizer-coverage-inline-8bit-counters", "-Cllvm-args=-sanitizer-coverage-pc-table", "-Cllvm-args=-sanitizer-coverage-trace-compares", "-Cllvm-args=-simplifycfg-branch-fold-threshold=0"]

[profile.fuzz.package.bun_js_parser]
rustflags = ["-Cpasses=sancov-module", "-Cllvm-args=-sanitizer-coverage-level=4", "-Cllvm-args=-sanitizer-coverage-inline-8bit-counters", "-Cllvm-args=-sanitizer-coverage-pc-table", "-Cllvm-args=-sanitizer-coverage-trace-compares", "-Cllvm-args=-simplifycfg-branch-fold-threshold=0"]

# Without the operands of comparisons: an interner, which is made for every text, compares a lot.
[profile.fuzz.package.bun_sema]
rustflags = ["-Cpasses=sancov-module", "-Cllvm-args=-sanitizer-coverage-level=4", "-Cllvm-args=-sanitizer-coverage-inline-8bit-counters", "-Cllvm-args=-sanitizer-coverage-pc-table", "-Cllvm-args=-simplifycfg-branch-fold-threshold=0"]

# To see which lines a corpus reaches: coverage.sh.
[profile.coverage]
inherits = "release"

[profile.coverage.package.bun_format]
rustflags = ["-Cinstrument-coverage"]

[profile.coverage.package.bun_md]
rustflags = ["-Cinstrument-coverage"]

[profile.coverage.package.bun_lint]
rustflags = ["-Cinstrument-coverage"]

[profile.coverage.package.bun_lint_eslint]
rustflags = ["-Cinstrument-coverage"]

[profile.coverage.package.bun_lint_typescript]
rustflags = ["-Cinstrument-coverage"]

[profile.coverage.package.bun_lint_plugins]
rustflags = ["-Cinstrument-coverage"]

[profile.coverage.package.bun_sema_parser]
rustflags = ["-Cinstrument-coverage"]

[profile.coverage.package.bun_js_parser]
rustflags = ["-Cinstrument-coverage"]

[profile.coverage.package.bun_sema]
rustflags = ["-Cinstrument-coverage"]
