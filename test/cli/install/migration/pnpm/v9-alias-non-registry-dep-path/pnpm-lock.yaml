  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      outer:
        specifier: file:outer
        version: file:outer

packages:

  bar@https://codeload.github.com/o/bar/tar.gz/aeb6b15f9c9957c8fa56f9731e914c4d8a6d2f2b:
