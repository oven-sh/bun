    version: 2.0.0

  hi2@file:shared/config:
    resolution: {directory: shared/config, type: directory}
    version: 1.0.0

  outer@file:outer:
    resolution: {directory: outer, type: directory}
    version: 1.0.0

snapshots:

  bar@https://codeload.github.com/o/bar/tar.gz/aeb6b15f9c9957c8fa56f9731e914c4d8a6d2f2b: {}

  hi2@file:shared/config: {}

  outer@file:outer:
    dependencies:
      config: hi2@file:shared/config
