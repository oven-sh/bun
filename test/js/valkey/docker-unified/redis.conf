bind 0.0.0.0
protected-mode no
appendonly yes
# No RDB save points: with them, every FLUSHALL rewrites the snapshot and pays
# an fsync. The tests flush before each case. The AOF still covers restarts.
save ""
port 6379
tls-port 6380
tls-cert-file /etc/redis/certs/server.crt
tls-key-file /etc/redis/certs/server.key
tls-ca-cert-file /etc/redis/certs/server.crt
databases 16
aclfile /etc/redis/users.acl
