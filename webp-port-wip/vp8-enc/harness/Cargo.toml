[package]
name = "webp-diff"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
bun_webp = { path = "/root/repos/oven-sh/bun/.claude/worktrees/agent-a4376b1e3d6e35a81/src/webp" }

# Optimised, but an integer overflow or a failed debug_assert! in bun_webp still aborts.
[profile.release]
opt-level = 3
overflow-checks = true
debug-assertions = true
debug = 1
panic = "abort"

[profile.perf]
inherits = "release"
overflow-checks = false
debug-assertions = false
codegen-units = 1
lto = "fat"

[profile.perf2]
inherits = "perf"
lto = "off"
