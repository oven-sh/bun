[package]
name = "webp-diff"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
bun_webp = { path = "/root/ref/crate" }

# Optimised, but an integer overflow or a failed debug_assert! in bun_webp still aborts.
[profile.release]
opt-level = 3
overflow-checks = true
debug-assertions = true
debug = 1
panic = "abort"

# What Bun ships: no overflow checks, no debug assertions. For the bench-* commands only:
#   RUSTFLAGS="-Ctarget-cpu=nehalem" cargo build --profile perf && ./target/perf/webp-diff bench-...
# (every x64 build of Bun targets nehalem: SSE4.2, no AVX.)
[profile.perf]
inherits = "release"
overflow-checks = false
debug-assertions = false
codegen-units = 1
lto = "fat"
